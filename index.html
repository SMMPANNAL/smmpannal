
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM PANNAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f0f6ff;color:#17365d}
header{background:#1265db;color:white;padding:20px;font-size:23px;font-weight:bold}
.container{max-width:420px;margin:35px auto;padding:18px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 20px #d4e2f5}
h2{text-align:center;color:#1265db}
input{width:100%;padding:14px;margin:9px 0;border:1px solid #ccd9ed;border-radius:9px}
button{width:100%;padding:14px;background:#1265db;color:white;border:0;border-radius:9px;margin-top:12px;font-size:16px}
.link{text-align:center;color:#1265db;cursor:pointer;margin-top:18px}
.hidden{display:none}
#dashboard{max-width:600px;margin:25px auto;padding:15px}
.stat{background:#e1efff;padding:20px;border-radius:12px;margin:12px 0}
small{color:#61758d}
</style>
</head>
<body>

<header>⚡ SMM PANNAL</header>

<div class="container" id="auth">

<div class="card" id="login">
<h2>Welcome Back!</h2>
<p align="center">Login to SMM PANNAL</p>
<form id="loginForm">
<input type="email" id="loginEmail" placeholder="Email Address" required>
<input type="password" id="loginPass" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div class="link" onclick="showSignup()">New User? Create Account</div>
</div>

<div class="card hidden" id="signup">
<h2>Create Account</h2>
<form id="signupForm">
<input id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email Address" required>
<input type="password" id="password" placeholder="Create Password (min 8 characters)" minlength="8" required>
<button type="submit">Sign Up</button>
</form>
<div class="link" onclick="showLogin()">Already have account? Login</div>
</div>

</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Welcome to SMM PANNAL!</h2>
<p id="welcome"></p>
<div class="stat">Wallet Balance: ₹0</div>
<div class="stat">Total Orders: 0</div>
<p><small>This is a demo dashboard.</small></p>
<button onclick="logout()">Logout</button>
</div>
</div>

<script>
function showSignup(){
document.getElementById('login').classList.add('hidden');
document.getElementById('signup').classList.remove('hidden');
}
function showLogin(){
document.getElementById('signup').classList.add('hidden');
document.getElementById('login').classList.remove('hidden');
}

function getUsers(){
return JSON.parse(localStorage.getItem('smm_users')||'[]');
}

document.getElementById('signupForm').addEventListener('submit',function(e){
e.preventDefault();
let users=getUsers();
let name=document.getElementById('name').value.trim();
let email=document.getElementById('email').value.trim().toLowerCase();
let password=document.getElementById('password').value;

if(users.some(u=>u.email===email)){
alert('This email is already registered!');
return;
}
users.push({name,email,password});
localStorage.setItem('smm_users',JSON.stringify(users));
alert('Demo account created! Please login.');
this.reset();
showLogin();
});

document.getElementById('loginForm').addEventListener('submit',function(e){
e.preventDefault();
let email=document.getElementById('loginEmail').value.trim().toLowerCase();
let password=document.getElementById('loginPass').value;
let user=getUsers().find(u=>u.email===email&&u.password===password);

if(!user){alert('Invalid email or password');return;}
sessionStorage.setItem('smm_current',user.name);
openDashboard();
});

function openDashboard(){
let name=sessionStorage.getItem('smm_current');
if(!name)return;
document.getElementById('auth').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
document.getElementById('welcome').innerText='Hello, '+name;
}
function logout(){
sessionStorage.removeItem('smm_current');
document.getElementById('dashboard').classList.add('hidden');
document.getElementById('auth').classList.remove('hidden');
showLogin();
}
openDashboard();
</script>
</body>
</html>
