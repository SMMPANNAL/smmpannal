<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMM PANNAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5fb;color:#17233b}
header{background:#142b55;color:white;padding:22px;text-align:center}
main{max-width:900px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 3px 12px #0001}
input,button,textarea,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd3df;border-radius:8px}
button{background:#155bd5;color:white;border:0;font-weight:bold}
button.secondary{background:#52627a}
.hidden{display:none}
nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h2{color:#17427e}
.item{padding:12px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<header>
<h1>SMM PANNAL</h1>
<p>Your Social Media Creator Platform</p>
</header>
<main>

<div id="home" class="card">
<h2>Welcome to SMM PANNAL</h2>
<p>Choose your login</p>
<button onclick="openLogin('customer')">Customer Login</button>
<button onclick="openLogin('admin')">Admin Login</button>
</div>

<div id="loginPage" class="card hidden">
<h2 id="loginTitle">Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="secondary" onclick="signup()">Create Customer Account</button>
<button class="secondary" onclick="forgot()">Forgot Password</button>
<button class="secondary" onclick="goHome()">Back</button>
</div>

<div id="customerPage" class="hidden">
<div class="card">
<h2>Customer Dashboard</h2>
<p id="customerName"></p>
<nav>
<button onclick="page('services')">Services</button>
<button onclick="page('orders')">My Orders</button>
<button onclick="page('ai')">AI Studio</button>
<button onclick="page('support')">Help & Support</button>
<button onclick="page('wallet')">Wallet</button>
<button onclick="logout()">Logout</button>
</nav>
</div>
<div id="customerContent" class="card"></div>
</div>

<div id="adminPage" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<p>Administrator Panel</p>
<nav>
<button onclick="adminPage('orders')">Manage Orders</button>
<button onclick="adminPage('services')">Manage Services</button>
<button onclick="adminPage('tickets')">Support Tickets</button>
<button onclick="adminPage('payments')">Payment Requests</button>
<button onclick="logout()">Logout</button>
</nav>
</div>
<div id="adminContent" class="card"></div>
</div>

</main>
<script>
const SUPABASE_URL="https://xaemcfpghkcpjmgakejf.supabase.co";
const SUPABASE_KEY="sb_publishable_7dMJNKE5WWQlDIQG0l-pGw_R_2wubTq";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let role="";
let loginType="customer";

function openLogin(type){
 loginType=type;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("loginTitle").textContent=type==="admin"?"Admin Login":"Customer Login";
}

function goHome(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}

function notice(t){alert(t)}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){notice(error.message);return}
 await start(data.user);
}

async function signup(){
 if(loginType!=="customer"){notice("Admin accounts are created separately.");return}
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signUp({email,password});
 if(error){notice(error.message);return}
 notice("Account created. Confirm your email if required, then login.");
}

async function forgot(){
 const email=document.getElementById("email").value.trim();
 if(!email){notice("Enter your email first");return}
 const {error}=await db.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });
 notice(error?error.message:"Password reset email sent.");
}

async function start(u){
 user=u;
 const {data,error}=await db.from("profiles")
  .select("full_name,role").eq("id",u.id).maybeSingle();
 if(error){notice("Profile error: "+error.message);return}
 if(!data){
  const {error:e}=await db.from("profiles").insert({
   id:u.id,full_name:u.email,role:"customer"
  });
  if(e){notice(e.message);return}
  role="customer";
 }else{
  role=data.role||"customer";
 }
 document.getElementById("home").classList.add("hidden");
 document.getElementById("loginPage").classList.add("hidden");

 if(loginType==="admin" && role!=="admin"){
  notice("This account is not an admin account.");
  await logout();
  return;
 }

 if(role==="admin"){
  document.getElementById("adminPage").classList.remove("hidden");
  adminPage("orders");
 }else{
  document.getElementById("customerPage").classList.remove("hidden");
  document.getElementById("customerName").textContent="Welcome "+u.email;
  page("services");
 }
}

function page(name){
 const box=document.getElementById("customerContent");
 box.innerHTML="";
 if(name==="services"){
  box.innerHTML="<h2>Services</h2><div id='serviceList'>Loading...</div>";
  loadServices();
 }
 if(name==="orders"){
  box.innerHTML="<h2>My Orders</h2><div id='orderList'>Loading...</div>";
  loadOrders();
 }
 if(name==="ai"){
  box.innerHTML="<h2>AI Studio</h2><h3>AI Thumbnail Maker</h3><input id='topic' placeholder='Enter video topic'><button onclick='notice(\"AI image generation will be connected through a secure AI service.\")'>Create Thumbnail</button><h3>AI Video Editor</h3><p>Video editing tools will be connected here.</p><h3>Photo to Video</h3><p>AI photo animation tools will be connected here.</p><h3>AI Caption Maker</h3><textarea id='captionTopic' placeholder='Enter your topic'></textarea><button onclick='notice(\"AI caption service will be connected next.\")'>Generate Caption</button>";
 }
 if(name==="support"){
  box.innerHTML="<h2>Help & Support</h2><input id='subject' placeholder='Subject'><textarea id='ticket' placeholder='Message'></textarea><button onclick='sendTicket()'>Send Ticket</button>";
 }
 if(name==="wallet"){
  box.innerHTML="<h2>Wallet</h2><p>Wallet history</p><div id='walletList'>Loading...</div>";
  loadWallet();
 }
}

async function loadServices(){
 const {data,error}=await db.from("services").select("*").eq("active",true);
 const box=document.getElementById("serviceList");
 if(error){box.textContent=error.message;return}
 box.innerHTML="";
 (data||[]).forEach(s=>{
  const d=document.createElement("div");
  d.className="item";
  d.textContent=s.name+" | "+s.platform+" | ₹"+s.price;
  box.appendChild(d);
 });
 if(!data?.length)box.textContent="No services available.";
}

async function loadOrders(){
 const {data,error}=await db.from("orders").select("*")
 .eq("user_id",user.id).order("created_at",{ascending:false});
 const box=document.getElementById("orderList");
 if(error){box.textContent=error.message;return}
 box.innerHTML="";
 (data||[]).forEach(o=>{
  const d=document.createElement("div");
  d.className="item";
  d.textContent=o.target_url+" | "+o.status;
  box.appendChild(d);
 });
}

async function loadWallet(){
 const {data,error}=await db.from("wallet_transactions").select("*")
 .eq("user_id",user.id).order("created_at",{ascending:false});
 const box=document.getElementById("walletList");
 if(error){box.textContent=error.message;return}
 box.innerHTML="";
 (data||[]).forEach(t=>{
  const d=document.createElement("div");
  d.className="item";
  d.textContent=t.transaction_type+" | ₹"+t.amount;
  box.appendChild(d);
 });
}

async function sendTicket(){
 const subject=document.getElementById("subject").value.trim();
 const message=document.getElementById("ticket").value.trim();
 if(!subject||!message){notice("Fill both fields");return}
 const {error}=await db.from("support_tickets").insert({
  user_id:user.id,subject,message,status:"open"
 });
 notice(error?error.message:"Ticket submitted");
}

async function adminPage(name){
 const box=document.getElementById("adminContent");
 box.innerHTML="<h2>"+name+"</h2>";
 if(role!=="admin"){box.textContent="Admin access required";return}

 if(name==="orders"){
  const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
  if(error){box.textContent=error.message;return}
  (data||[]).forEach(o=>{
   const d=document.createElement("div");
   d.className="item";
   d.textContent=o.id+" | "+o.target_url+" | "+o.status;
   box.appendChild(d);
  });
 }
 if(name==="services"){
  box.innerHTML+="<p>Service management will be added after database setup.</p>";
 }
 if(name==="tickets"){
  const {data,error}=await db.from("support_tickets").select("*");
  if(error){box.textContent=error.message;return}
  (data||[]).forEach(t=>{
   const d=document.createElement("div");
   d.className="item";
   d.textContent=t.subject+" | "+t.message+" | "+t.status;
   box.appendChild(d);
  });
 }
 if(name==="payments"){
  box.innerHTML+="<p>Payment requests and bank details need a separate secure payment setup.</p>";
 }
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session) await start(data.session.user);
})();
</script>
</body>
</html>
